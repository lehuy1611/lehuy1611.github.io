<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 64" fill="none">
  <!-- Minimal cloud: single flat sky-100 fill, low opacity, no halo,
       no gradient — sits as a whisper of sky behind the text so it
       blends with the white page instead of drawing attention. -->
